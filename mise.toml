[tools]
dotnet = "10"

[tasks.restore]
run = "dotnet restore ce-record-chain.sln --locked-mode"

[tasks.build]
depends = ["restore"]
run = "dotnet build ce-record-chain.sln --no-restore --configuration Release"

[tasks.test]
depends = ["restore"]
run = "dotnet test ce-record-chain.sln --no-restore --configuration Release"

[tasks.publish]
shell = "powershell.exe -NoProfile -Command"
run = [
  '''
  $paths = @(
    'artifacts/ce-record-chain-3.0.0-win-x64'
    'artifacts/ce-record-chain-3.0.0-win-x64.zip'
  )

  foreach ($path in $paths) {
    if (Test-Path $path) {
      Remove-Item -Recurse -Force $path
    }
  }
  ''',
  "dotnet restore src/CreationEngine.RecordChain/CreationEngine.RecordChain.csproj --locked-mode",
  "dotnet publish src/CreationEngine.RecordChain/CreationEngine.RecordChain.csproj --configuration Release --no-restore --no-self-contained -p:DebugType=None -p:DebugSymbols=false --output artifacts/ce-record-chain-3.0.0-win-x64",
  "& C:/Windows/System32/tar.exe -a -c -f artifacts/ce-record-chain-3.0.0-win-x64.zip -C artifacts/ce-record-chain-3.0.0-win-x64 .",
]
