[tools]
dotnet = "10.0.303"

[tasks.restore]
run = "dotnet restore skyrim-record-chain.sln --locked-mode"

[tasks.build]
depends = ["restore"]
run = "dotnet build skyrim-record-chain.sln --no-restore --configuration Release"

[tasks.test]
depends = ["restore"]
run = "dotnet test skyrim-record-chain.sln --no-restore --configuration Release"

[tasks.publish]
run = "powershell.exe -NoProfile -Command \"if (Test-Path 'artifacts/skyrim-record-chain-0.1.0-win-x64') { Remove-Item -Recurse -Force 'artifacts/skyrim-record-chain-0.1.0-win-x64' }; if (Test-Path 'artifacts/skyrim-record-chain-0.1.0-win-x64.zip') { Remove-Item -Force 'artifacts/skyrim-record-chain-0.1.0-win-x64.zip' }\" && dotnet restore src/Skyrim.RecordChain/Skyrim.RecordChain.csproj --locked-mode && dotnet publish src/Skyrim.RecordChain/Skyrim.RecordChain.csproj --configuration Release --no-restore --no-self-contained -p:DebugType=None -p:DebugSymbols=false --output artifacts/skyrim-record-chain-0.1.0-win-x64 && C:/Windows/System32/tar.exe -a -c -f artifacts/skyrim-record-chain-0.1.0-win-x64.zip -C artifacts/skyrim-record-chain-0.1.0-win-x64 ."
