name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Validate release version
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          if ($tag -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Release tag must have the form v1.2.3: $tag"
          }

          $version = $tag.Substring(1)
          [xml] $project = Get-Content "src/CreationEngine.RecordChain/CreationEngine.RecordChain.csproj"
          $projectVersion = [string] $project.Project.PropertyGroup.Version
          if ($projectVersion -ne $version) {
            throw "Project version $projectVersion does not match tag $tag."
          }

      - name: Set up mise
        uses: jdx/mise-action@v4

      - name: Run tests
        run: mise run test

      - name: Build release archive
        run: mise run publish

      - name: Smoke-test published executable
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".Substring(1)
          $executable = "artifacts/ce-record-chain-$version-win-x64/ce-record-chain.exe"

          & $executable --help
          if ($LASTEXITCODE -ne 0) { throw "Published executable smoke test failed." }

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.Substring(1)
          gh release create $tag `
            "artifacts/ce-record-chain-$version-win-x64.zip" `
            --verify-tag `
            --title $tag `
            --generate-notes
