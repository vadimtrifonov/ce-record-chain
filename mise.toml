[tools]
dotnet = "10"

[tasks.restore]
run = "dotnet restore ce-record-chain.sln --locked-mode"

[tasks.build]
depends = ["restore"]
run = "dotnet build ce-record-chain.sln --no-restore --configuration Release"

[tasks.test]
depends = ["restore"]
run = "dotnet test ce-record-chain.sln --no-restore --configuration Release"

[tasks.publish]
shell = "powershell.exe -NoProfile -Command"
run = '''
$ErrorActionPreference = 'Stop'
$projectPath = 'src/CreationEngine.RecordChain/CreationEngine.RecordChain.csproj'
[xml] $project = Get-Content $projectPath
$version = [string] $project.Project.PropertyGroup.Version
$folder = "artifacts/ce-record-chain-$version-win-x64"
$archive = "$folder.zip"
foreach ($path in @($folder, $archive)) {
  if (Test-Path $path) { Remove-Item -Recurse -Force $path }
}
dotnet publish $projectPath --configuration Release --no-self-contained -p:RestoreLockedMode=true -p:DebugType=None -p:DebugSymbols=false --output $folder
if ($LASTEXITCODE -ne 0) { throw 'Publish failed.' }
& "$env:SystemRoot/System32/tar.exe" -a -c -f $archive -C $folder .
if ($LASTEXITCODE -ne 0) { throw 'Archive creation failed.' }
'''
